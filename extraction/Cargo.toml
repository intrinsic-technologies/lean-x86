[package]
name = "x86-extract"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
